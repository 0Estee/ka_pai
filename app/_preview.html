<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>预览（开发用）</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="screens.css">
</head>
<body>
  <div id="app">
    <div id="stage"></div>
    <div id="menu" class="hidden"></div>
  </div>
  <script src="dist/bundle.js"></script>
  <script>
    // 开发预览页：暂停自动回合循环，双方 AI 代打推进到第 N 回合，
    // 停在有单位的中局画面，便于截图检查布局。
    // 这个文件不会被打进 APK。
    //
    //   ?turn=4                 推进到第 4 回合
    //   ?turn=4&demo=kingtarget 额外选中一张【攻击】，检查国王目标高亮
    //   ?demo=hand              把手牌换成第二批手绘卡，检查卡面文字排版
    //   ?demo=hand&cards=U11,U12 指定要放进手牌的卡
    //   ?theme=light            切到浅色主题（检查配色）
    //   ?screen=home|settings|replays|play|difficulty  直接打开某个屏幕
    //   ?demo=replays&n=5       先跑 5 局自动对战，再打开回放列表
    //   ?demo=replay&step=30    跑一局后打开回放播放器并步进 30 步
    //   ?demo=nav               用真实点击走完「开始游戏 → AI 对决 → 开始对战」
    //   ?demo=unitinfo          推到场上有单位，然后点开一个单位的详情面板
    const p = new URLSearchParams(location.search);
    // 截图用：把入场动画与过渡全部关掉 —— --screenshot 是在 load 后马上抓，
    // 带 0.5s 入场动画的菜单项那时还是透明的，截出来就是"这一屏什么都没有"。
    if (p.get('noanim')) {
      const st = document.createElement('style');
      // 一并把特效层藏掉：飞行/爪印那些克隆节点是靠动画自己退场的，
      // 关掉动画后它们会永远停在原地，截图里就变成「一张牌糊在顶栏上」。
      st.textContent = '*,*::before,*::after{animation:none!important;transition:none!important}'
        + '#fx-layer{display:none!important}';
      document.head.appendChild(st);
    }
    // 走 __setTheme 而不是直接改 dataset —— 否则设置页里的选中态会和实际配色对不上
    if (p.get('theme')) window.__setTheme(p.get('theme'));
    const demo = p.get('demo');
    if (p.get('screen') === 'lobby') {
      window.__demoLobby({
        mode: p.get('mode') || 'host',
        myName: p.get('me') || '张三',
        peerName: p.get('peer') || '李四',
        online: p.get('online') !== '0',
        discoverError: p.get('warn') || '',
        gameReady: p.get('ready') === '1',
        code: p.get('code') || 'K7QM2P',
      });
    } else if (p.get('screen')) {
      window.__go(p.get('screen'));
    } else if (demo === 'sandbox') {
      // 靶场：开一局并把指定的牌摆上去（place=side,cardId,lane,row;…）
      const place = (p.get('place') || '').split(';').filter(Boolean).map((x) => {
        const [side, id, lane, row] = x.split(',');
        return [Number(side), id, lane, row];
      });
      const sbRet = window.__sandbox({ place, side: Number(p.get('side') || 0), foeFaction: p.get('foeFaction') || '' });
      document.title = 'demo: ' + JSON.stringify(sbRet);
      // 卡牌飞行（deploy → 落点）会把格子先藏起来、等动画结束再露出。
      // 截图是一次性的（而且 noanim 把动画关了，animationend 不会来），
      // 这里直接把飞行清掉，格子立刻显示 —— 这只是截图时的手法，不是产品行为。
      if (window.__clearFlights) window.__clearFlights();
      window.__revealAll();
      if (p.get('report')) {
        const pre = document.createElement('pre');
        pre.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff;color:#000;font:10px/1.4 monospace;padding:6px;white-space:pre-wrap;margin:0';
        pre.textContent = JSON.stringify(sbRet, null, 1);
        document.body.appendChild(pre);
      }
    } else if (demo === 'sbclick') {
      /**
       * 靶场点击链路自检（真实 DOM 点击，不是直接调引擎）：
       *   1. 开局并把手牌换成一张确定的单位牌
       *   2. 点这张手牌 → 点**对面**前排的格子
       *   3. 报告：对面格子里有没有牌、选中的那张牌还在不在手里
       */
      window.__sandbox();
      // 直接把「回合开始」这个自动阶段推过去：截图是一次性的，等不了 setTimeout。
      // 真实玩家等的那 260ms 就是这一步，推进完 busy 也就该是 false 了。
      window.__advance();
      window.__view().busy = false;
      window.__revealAll();
      const stage = document.getElementById('stage');
      // 要挑一张**单位**牌（.is-unit）：锦囊点格子是「打过去」，不会在格子里留牌
      const cardEl = stage.querySelector('.hand .card.is-unit');
      if (cardEl) cardEl.click();
      const selected = document.querySelector('.card.selected');
      const foeSlot = document.querySelector('.board-row.r-foe-front .slot[data-side="1"]');
      if (foeSlot) foeSlot.click();
      const st = window.__game();
      const placed = st && st.board.mountain.units[1].front;
      window.__probeOk = !!(selected && placed);
      const report = [
        '第一张手牌：' + (cardEl ? (cardEl.textContent || '').replace(/\s+/g, ' ').slice(0, 20) : '没找到'),
        '选中态：' + !!selected + '（selectedIid=' + (window.__view().selectedIid) + '）',
        '点对面山地前排 → ' + (placed ? '放下 ' + placed.name : '没放上'),
        '我方手牌：' + (st ? st.players[0].hand.length : '-'),
        '提示行：' + (window.__view().hint || ''),
      ].join('\n');
      document.title = 'demo: ' + report.replace(/\n/g, ' | ');
      if (window.__clearFlights) window.__clearFlights();
      window.__revealAll();
      if (!p.get('silent')) {
        const pre = document.createElement('pre');
        pre.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#fff;color:#000;font:11px/1.6 monospace;padding:10px;white-space:pre-wrap;margin:0';
        pre.textContent = report;
        document.body.appendChild(pre);
      }
    } else if (demo === 'watch') {
      // 观战中：只读视角、不画手牌区；side=1 看「玩家2 在下面」那一侧
      const info = window.__watchDemo(Number(p.get('turn') || 4), Number(p.get('side') || 0));
      document.title = 'demo: ' + JSON.stringify(info) + ' side=' + window.__watchSide(Number(p.get('side') || 0));
      window.__revealAll();
    } else if (demo === 'adminEdit') {
      // 管理后台「改数据」：管理员 + 三个用户 + 一条审计，再把 alice 的面板摊开
      window.__adminDemo();
      const shown = window.__adminEditShow('alice', {
        data: {
          v: 2, gold: 120, dust: 30, perf: 640, games: 12, wins: 7, losses: 5, draws: 0,
          forge: { v: 1, cards: { U01: { lvl: 9, masteries: ['w_atk'] }, U02: { lvl: 3, masteries: [] } } },
        },
        version: 4, updatedAt: '2026-10-22T21:10:00.000Z', bytes: 186,
        summary: { games: 12, wins: 7, perf: 640, gold: 120 },
      });
      window.__go('admin');
      if (p.get('raw')) window.__adminEditState({ rawOpen: true });
      if (p.get('saved')) window.__adminEditState({ hint: '已写入云端 v5。玩家下次同步时选「用云端」即可生效。', version: 5 });
      document.title = 'demo: adminEdit ' + (shown ? 'ok' : 'fail');
      window.__revealAll();
    } else if (demo === 'sbfaction') {
      // 靶场换阵营：手里的旧阵营牌要被收走，只留新阵营那一整套
      window.__sandbox();
      window.__advance();
      window.__view().busy = false;
      const r = window.__sbFaction(0, p.get('fac') || 'demon');
      document.title = 'demo: ' + JSON.stringify(r);
      window.__revealAll();
    } else if (demo === 'watchlobby') {
      window.__watchLobby(p.get('code') || 'K7QM2P', p.get('status') || 'connected');
    } else if (demo === 'sbdamage') {
      /**
       * 靶场里真打一下，停在「命中」那一帧：
       * 看的就是格子上的掉字 + 下面那行原因（作者 2026-10-22 第 1 条最后一句）。
       */
      window.__sandbox({
        place: [
          [0, p.get('att') || 'U50', 'mountain', 'front'],
          [1, p.get('def') || 'U51', 'mountain', 'front'],
        ],
      });
      window.__clearFlights();
      window.__revealAll();             // 棋盘先铺开，不然命中那一帧的格子是隐形的
      const st0 = window.__game();
      for (let i = 0; i < 12 && st0.phase !== 'COMBAT'; i++) window.__advance();
      window.__advance();               // 开战：把伤害结算出来
      for (let i = 0; i < 24; i++) {
        const v = window.__view();
        if (v.fx && v.fx.kind === 'hit') break;
        window.__stepFx();
      }
      window.__clearFlights();
      document.title = 'demo: fx=' + JSON.stringify(window.__view().fx || null);
    } else if (demo === 'sbpick') {
      // 靶场「加牌」面板：整个卡池按阵营分组
      window.__sandbox();
      window.__advance();
      window.__view().busy = false;
      window.__nav('sb-add', {});
      window.__revealAll();
    } else if (demo === 'factionclick') {
      // 点「阵营」那一行（不是右侧的「介绍」按钮）：介绍要自己摊开
      window.__go('difficulty');
      const want = p.get('fac') || 'sword';
      const row = document.querySelector('.fac-row[data-key="' + want + '"]');
      if (row) row.click();
      document.title = 'demo: intro=' + !!document.querySelector('.fac-intro');
    } else if (demo === 'factioninfo') {
      // 难度页：展开某个阵营的介绍
      window.__showFaction(p.get('fac') || 'demon');
    } else if (demo !== 'nav' && demo !== 'unitinfo') {
      window.__playTurns(Number(p.get('turn') || 4));
    }
    if (demo === 'kingtarget') {
      const info = window.__demoKingTarget();
      document.title = 'demo: ' + JSON.stringify(info);
    } else if (demo === 'hand') {
      const cards = (p.get('cards') || '').split(',').map((s) => s.trim()).filter(Boolean);
      document.title = 'demo: ' + JSON.stringify(window.__demoHand(cards));
    } else if (demo === 'replays') {
      const n = Number(p.get('n') || 5);
      for (let i = 0; i < n; i++) { window.__newGame(); window.__autoPlay(); }
      window.__replayNote(1, '关键的一局');
      window.__go('replays');
    } else if (demo === 'replay') {
      window.__newGame();
      window.__autoPlay();
      document.title = 'demo: ' + JSON.stringify(window.__replayDemo(0, Number(p.get('step') || 30)));
    } else if (demo === 'fxprobe') {
      // 真打一下（不是手摆特效）：报告爪痕起点 / 爪印大小 / 残影 data-uid
      const info = window.__fxKillProbe(p.get('att') || 'W04', p.get('def') || 'E01');
      const pre = document.createElement('pre');
      pre.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#fff;color:#000;font:10px/1.4 monospace;padding:8px;white-space:pre-wrap;margin:0';
      pre.textContent = JSON.stringify(info, null, 1);
      document.body.appendChild(pre);
    } else if (demo === 'fxshow') {
      // 把爪痕 / 爪印定格在第一帧（动画本身由浏览器播，截图抓不到），看它们落在哪、多大
      window.__fxKillProbe(p.get('att') || 'W04', p.get('def') || 'E01');
      const st = document.createElement('style');
      st.textContent = '.fx-claw i{animation:none!important;opacity:1!important;transform:none!important}'
        + '.fx-rake{animation:none!important;opacity:1!important;transform:rotate(var(--a,0deg)) scaleX(1)!important}';
      document.head.appendChild(st);
    } else if (demo === 'nav') {      // 真实点击（不是 __go 跳屏）：这条路上曾经永远开不了 AI 局
      const hit = (act) => {
        const el = document.querySelector('[data-act="' + act + '"]');
        if (!el) { window.__probeFail = '找不到按钮 ' + act; return false; }
        el.click();
        return true;
      };
      hit('start-game'); hit('choose-ai'); hit('start-ai');
      document.title = 'demo: screen=' + window.__screen() + ' 有对局=' + !!window.__game();
      window.__probeOk = window.__screen() === 'game' && !!window.__game();
    } else if (demo === 'unitinfo') {
      window.__newGame();
      // 推到场上有单位，再点开详情面板（棋盘格子放不下卡面文字）
      outer:
      for (let i = 0; i < 60; i++) {
        const st = window.__game();
        for (const lane of ['mountain', 'plainL', 'plainR', 'water']) {
          for (const side of [0, 1]) {
            for (const row of ['front', 'back']) {
              const u = st.board[lane].units[side][row];
              if (u) {
                window.__tapUnit(u.uid);
                if (document.getElementById('stage').innerHTML.includes('ui-effect')) break outer;
              }
            }
          }
        }
        window.__playTurns(i + 1);
      }
      window.__probeOk = document.getElementById('stage').innerHTML.includes('unit-info');
      document.title = 'demo: 详情面板=' + window.__probeOk;
    } else if (demo === 'soldier') {
      // 「拟定目标攻击」（强化士兵）：开战结算轮到它出手时弹出选目标面板。
      // 这是唯一一个**在开战中途**挂起的交互，要肉眼确认面板真的出现、选项齐全。
      window.__newGameFirst();
      window.__pause(true);
      const put = (side, id, lane, row) => window.__place(side, id, lane, row || 'front');
      put(1, 'W04', 'mountain', 'front');   // 5/6 挡路者
      put(1, 'E01', 'plainR', 'front');     // 别路 1/1
      put(0, 'U396', 'mountain', 'front');  // 强化士兵
      window.__setPhase('SPELL_FIRST');
      window.__go('game');
      for (let i = 0; i < 3 && !window.__game().pending; i++) window.__advance();
      const st = window.__game();
      window.__probeOk = !!st.pending && st.pending.request.type === 'combatTarget';
      document.title = 'demo: 选目标面板=' + window.__probeOk
        + ' 选项数=' + (st.pending ? st.pending.request.options.length : 0);
    } else if (demo === 'claw') {
      // 爪印贴到卡上的位置与大小（定格看）：手动往 #fx-layer 挂一整组爪印，
      // 并把每道抓痕的动画冻在「已出现」那一刻，方便截图核对。
      window.__newGameFirst();
      window.__pause(true);
      window.__place(1, 'W04', 'mountain', 'front');
      window.__place(0, 'W04', 'mountain', 'front');
      window.__go('game');
      const group = Number(p.get('group') || 2);
      const strokes = { 1: 3, 2: 6, 3: 3, 4: 3, 5: 1, 6: 4 }[group];
      const style = document.createElement('style');
      style.textContent = '.fx-claw i{animation:none!important;opacity:1!important}';
      document.head.appendChild(style);
      const unitEl = document.querySelector('.slot.mine.row-front .unit');
      const r = unitEl.getBoundingClientRect();
      const pad = Math.round(r.width * 0.12);
      const box = document.createElement('div');
      box.className = 'fx-claw';
      box.style.left = Math.round(r.left - pad) + 'px';
      box.style.top = Math.round(r.top - pad) + 'px';
      box.style.width = Math.round(r.width + pad * 2) + 'px';
      box.style.height = Math.round(r.height + pad * 2) + 'px';
      let html = '';
      for (let k = 1; k <= strokes; k++) {
        html += '<i style="background-image:url(\'img/claw-' + group + '-' + k + '.png\')"></i>';
      }
      box.innerHTML = html;
      document.getElementById('fx-layer').appendChild(box);
      window.__probeOk = !!document.querySelector('.fx-claw i');
      document.title = 'demo: 爪印组=' + group + ' 笔=' + strokes;
    } else if (demo === 'flip') {
      // 出手翻面：把动画冻在某个瞬间（默认 190ms = 380ms 动画正中，即 180° 背面朝人）。
      window.__newGameFirst();
      window.__pause(true);
      window.__place(1, 'W04', 'mountain', 'front');
      window.__place(0, 'W04', 'mountain', 'front');
      window.__go('game');
      const at = Number(p.get('at') || 190);
      const deg = Number(p.get('deg') || 180);
      // 用常驻选择器（不靠运行时加的类）：预览页的计时器会因为 --virtual-time-budget
      // 跑起来触发 refresh()，整块重写 #stage 会把临时类冲掉，截图就回到正面了。
      const style = document.createElement('style');
      style.textContent = '#stage .slot.mine.row-front .unit{animation:none!important;'
        + 'transform:perspective(420px) rotateY(' + deg + 'deg) scale(1.04)!important}'
        + '#stage .slot.mine.row-front .unit::after{animation:none!important;opacity:'
        + (deg >= 120 && deg <= 240 ? '1' : '0') + '!important}';
      document.head.appendChild(style);
      const slotEl = document.querySelector('.slot.mine.row-front');
      slotEl.classList.add('fx-lunge');
      const u = slotEl.querySelector('.unit');
      const cs = getComputedStyle(u);
      const after = getComputedStyle(u, '::after');
      window.__probeOk = true;
      document.title = 'demo: 翻面 ' + at + 'ms | transform=' + cs.transform
        + ' | anim=' + cs.animationName + ' ' + cs.animationPlayState + ' ' + cs.animationDelay
        + ' | after.op=' + after.opacity + ' after.anim=' + after.animationName;
    } else if (demo === 'pick') {
      // 两步放置：第一次点格子只选中（金色描边），提示语要求再点一次确认。
      window.__newGameFirst();
      window.__pause(true);
      const st = window.__game();
      const unitId = Object.keys(st.cardLib).find((id) => {
        const d = st.cardLib[id];
        return d.type === 'unit' && !d.token && d.atk > 0 && (d.keywords || []).length === 0;
      });
      st.phase = window.__me() === st.firstPlayer ? 'DEPLOY_FIRST' : 'DEPLOY_SECOND';
      st.players[0].manaCap = 99;
      st.players[0].mana = 99;
      const hc = { iid: st.nextIid++, cardId: unitId };
      st.players[0].hand.push(hc);
      window.__go('game');
      const sel = window.__selectCard(hc.iid);
      const slots = window.__view().legalSlots;
      if (slots.length) window.__slotClick(slots[0].lane, slots[0].row);
      const v = window.__view();
      window.__probeOk = !!document.querySelector('.slot.picked')
        && window.__game().players[0].hand.length > 0;
      document.title = 'demo: 选中落点=' + window.__probeOk + ' sel=' + sel
        + ' slots=' + slots.length + ' picked=' + JSON.stringify(v.pickedSlot) + ' 提示=' + v.hint;
    } else if (demo === 'ghost') {
      // 退场延后：开战演出途中，被打死的牌还画在格子里，且血量是「倒下前那一格」。
      window.__newGameFirst();
      window.__pause(true);
      window.__place(1, 'E01', 'mountain', 'front');   // 1/1，必定被打死
      window.__place(0, 'W04', 'mountain', 'front');   // 5/6 出手
      window.__go('game');
      for (let i = 0; i < 14 && window.__game().phase !== 'COMBAT'; i++) window.__advance();
      try { window.__advance(); } catch (e) { /* 演出由计时器接管 */ }
      const html = document.getElementById('stage').innerHTML;
      const m = html.match(/class="unit ghost[^"]*"[\s\S]{0,260}?data-value="(\d+)"/);
      window.__probeOk = html.includes('unit ghost');
      document.title = 'demo: 残影=' + window.__probeOk + ' 血量徽记=' + (m ? m[1] : '无')
        + ' 含ghost-wait=' + html.includes('ghost-wait');
    } else if (demo === 'coldreplay') {
      // 「打开 App → 直接点回放对局 → 点回放」：内存里还没有对局。
      // 这条路径曾经抛 TypeError，界面停在回放列表上（点了没反应）。
      window.__newGame();
      window.__autoPlay();
      window.__dropLiveGame();
      window.__go('replays');
      const btn = document.querySelector('[data-act="replay-open"]');
      if (btn) btn.click();
      const h = document.getElementById('stage').innerHTML;
      window.__probeOk = window.__screen() === 'replay' && h.includes('data-act="replay-toggle"');
      document.title = 'demo: screen=' + window.__screen() + ' 控制条=' + h.includes('data-act="replay-toggle"');
    }
    // 截图用：棋盘 / 手牌的入场是「data-in 从 0 翻成 1」驱动的，
    // 而 --screenshot 在 load 后立刻抓，那时还是 data-in="0"（不可见）。
    // 这里直接把标记翻到位，截出来才是玩家看到的中局画面。
    if (p.get('reveal')) {
      // 先让 view 也认为「已经铺完了」，否则紧接着的任何一次重绘都会把行重新
      // 渲染成 data-in="0"（截图就变成「只剩一行」的怪画面）。
      window.__revealAll();
      for (const el of document.querySelectorAll('[data-in]')) el.setAttribute('data-in', '1');
    }
    if (p.get('dump')) {
      // 诊断：把这一屏每个子节点的盒子与计算样式摊在白底上，截图就能读
      const dump = () => {
        const rows = [];
        for (const el of document.querySelectorAll(p.get('sel') || '.screen-head, .screen-body > *')) {
          const r = el.getBoundingClientRect();
          const cs = getComputedStyle(el);
          rows.push(el.tagName + '.' + (el.className || '-')
            + ' [' + Math.round(r.x) + ',' + Math.round(r.y) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) + ']'
            + ' op=' + cs.opacity + ' disp=' + cs.display + ' vis=' + cs.visibility
            + ' bg=' + cs.backgroundColor + ' col=' + cs.color + ' fs=' + cs.fontSize + ' bl=' + cs.borderLeftWidth + ' bs=' + cs.boxShadow.slice(0, 40) + ' bgim=' + cs.backgroundImage.slice(0, 30)
            + ' "' + (el.textContent || '').replace(/\s+/g, ' ').slice(0, 18) + '"');
        }
        // 命中测试：那一块像素上，最上面压着的到底是哪个节点
        for (const [x, y] of p.get('hit') ? p.get('hit').split(';').map((t) => t.split(',').map(Number)) : [[14, 512], [14, 560], [30, 512]]) {
          let el = document.elementFromPoint(x, y);
          const chain = [];
          for (let i = 0; el && i < 4; i++) { chain.push(el.tagName + '.' + (el.className || '-')); el = el.parentElement; }
          const cs = document.elementFromPoint(x, y);
          const g = cs ? getComputedStyle(cs) : null;
          rows.push('@' + x + ',' + y + ' → ' + chain.join(' < ') + (g ? ' | bg=' + g.backgroundColor + ' op=' + g.opacity : ''));
        }
        const pre = document.createElement('pre');
        pre.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#fff;color:#000;font:9px/1.35 monospace;padding:6px;white-space:pre-wrap;margin:0';
        pre.textContent = rows.join('\n');
        document.body.appendChild(pre);
      };
      if (p.get('dump') === 'now') dump();
      else setTimeout(dump, 400);
    }
  </script>
</body>
</html>
