     · fx-rp   → .rp-btn-play：播放 ↔ 暂停翻转的那一下               280ms

   退场一律不做，也不打算做：这些节点是 JS 当场摘掉的，CSS 根本没时间演；
   为了让"渐隐"晚 200ms 摘节点，只会让「对手已离开」这类提示该消失还赖着 —— 那更糟。
   回放那根 .rp-seek 同理：每次步进都是新节点，拇指位置没有"前一帧"可插值，
   所以进度条只做了按住时放大（见 .rp-seek:active），别指望它自己滑过去。
   ══ 清单结束 ══ */

/* ══════════════════════════════════════════════════════════
   星尘 HUD（第二种货币，只在首页与工坊出现）
   ══════════════════════════════════════════════════════════ */

.hud-dust {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: var(--scr-pill);
  background: var(--panel, #151c26);
  border: 1px solid var(--line, #2a3646);
  font-size: 13px;
  font-weight: 700;
  color: var(--text, #e6edf6);
  font-variant-numeric: tabular-nums;
}
/* 菱形 = 星尘。金币是圆的、金的是币，星尘是方的、冷的 —— 一眼分得开 */
.dust {
  width: 10px; height: 10px;
  display: inline-block;
  transform: rotate(45deg);
  border-radius: 2px;
  background: var(--accent, #58a6ff);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25);
}

/* ══════════════════════════════════════════════════════════
   强化工坊
   ══════════════════════════════════════════════════════════ */

.forge-wallet {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.forge-seg { margin-bottom: 10px; }
.forge-hint {
  font-size: 11px;
  color: var(--gold, #e8b84b);
  text-align: center;
  padding: 4px;
}
.forge-list { display: flex; flex-direction: column; gap: 12px; }
.forge-group-head {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--dim, #8b9bb0);
  padding: 2px 2px 6px;
}

.forge-card {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line, #2a3646);
  border-radius: var(--scr-r);
  background: var(--panel, #151c26);
  margin-bottom: 8px;
}
.fc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fc-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--text, #e6edf6); }
.fc-name { font-weight: 700; }
.fc-tag {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: var(--scr-r-sm);
  border: 1px solid var(--line, #2a3646);
  color: var(--dim, #8b9bb0);
}
.fc-mast {
  font-size: 9px;
  padding: 1px 6px;
  border-radius: var(--scr-pill);
  border: 1px solid var(--gold, #e8b84b);
  color: var(--gold, #e8b84b);
}
.fc-stats { display: flex; align-items: baseline; gap: 8px; font-size: 11px; color: var(--dim, #8b9bb0); font-variant-numeric: tabular-nums; }
.fc-stat-atk { color: var(--atk, #e06c5a); }
.fc-stat-hp { color: var(--hp, #6bbf73); }
.fc-was { font-size: 9px; color: var(--dim, #8b9bb0); opacity: .7; }

/* 九格强化进度：亮一格 = 强化过一次（第 9 格是那个 +0.2 的大步） */
.fc-pips { display: flex; gap: 3px; }
.fc-pips > i {
  width: 12px; height: 3px;
  border-radius: 2px;
  background: var(--panel-2, #1b2431);
}
.fc-pips > i.on { background: var(--gold, #e8b84b); }

.fc-tip { font-size: 9px; color: var(--dim, #8b9bb0); }

.fc-ops {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
  flex: none;
}
.fc-btn {
  padding: 7px 10px;
  border-radius: var(--scr-r);
  border: 1px solid var(--line, #2a3646);
  background: var(--panel-2, #1b2431);
  color: var(--text, #e6edf6);
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color .12s ease, border-color .12s ease, opacity .12s ease;
}
.fc-btn:active { border-color: var(--dim, #8b9bb0); }
.fc-btn:disabled { opacity: .42; cursor: default; }
/* 精通是这条链的终点，用金色描边把它和普通强化分开（不发光、不加底色） */
.fc-btn-mast { border-color: var(--gold, #e8b84b); color: var(--gold, #e8b84b); background: transparent; }
/* 洗掉是撤销动作：小一号、灰一点，别和两个主要按钮抢 */
.fc-btn-wash { padding: 4px 8px; font-size: 9px; border-color: transparent; background: transparent; color: var(--dim, #8b9bb0); }
.fc-btn-buy { flex: none; }

/* ── 精通三选一 ─────────────────────────────────────────── */
.skill-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 12px; }
.skill-opt {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: var(--scr-r);
  /* 稀有度颜色从 --rar 进来（JS 按档位写内联变量），边框是唯一的有色信号 */
  border: 1px solid var(--rar, var(--line, #2a3646));
  background: var(--panel, #151c26);
  color: var(--text, #e6edf6);
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  transition: background-color .12s ease;
}
.skill-opt:active { background: var(--panel-2, #1b2431); }
.skill-rar {
  flex: none;
  font-size: 9px;
  padding: 1px 6px;
  border-radius: var(--scr-pill);
  border: 1px solid var(--rar, var(--line, #2a3646));
  color: var(--rar, var(--dim, #8b9bb0));
}
.skill-name { flex: none; font-size: 13px; font-weight: 700; }
.skill-text { margin-left: auto; font-size: 11px; color: var(--dim, #8b9bb0); text-align: right; }

/* 结算面板的第二行：星尘 / 表现分（金币是主角，这两项是次要信息） */
.reward-sub {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: -2px 0 8px;
  font-size: 11px;
  color: var(--dim, #8b9bb0);
  font-variant-numeric: tabular-nums;
}
.reward-sub .dust { width: 8px; height: 8px; margin-right: 2px; }

/* 强化模式说明条（首页/难度页/大厅共用） */
.forge-mode-tip {
  padding: 8px 10px;
  margin-bottom: 10px;
  border: 1px solid var(--line, #2a3646);
  border-left: 2px solid var(--gold, #e8b84b);
  border-radius: var(--scr-r-sm);
  background: var(--panel, #151c26);
  color: var(--dim, #8b9bb0);
  font-size: 11px;
  line-height: 1.6;
}
.lobby-mode {
  margin-top: 6px;
  font-size: 11px;
  color: var(--dim, #8b9bb0);
}

html, body { height: auto !important; overflow: visible !important; background: #0b0a09 !important; }
body { margin: 0; padding: 0; color: #e9e2d5; font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; }
.pv-wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 56px; }
.pv-row { display: flex; gap: 32px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
.pv-col { flex: 0 0 390px; max-width: 100%; }
.pv-label { font-size: 12px; color: #9b8f7d; margin: 0 0 10px 2px; letter-spacing: .02em; }
.pv-frame { width: 390px; max-width: 100%; background: var(--bg); color: var(--text); border-radius: 16px; overflow: hidden; box-shadow: 0 18px 60px rgba(0,0,0,.45); }
.pv-frame .home { min-height: 0; overflow: visible; }
.p-light { background: #e9e0cb; color: #2b2620; }
@media (max-width: 760px) { .pv-row { gap: 40px; } .pv-col { flex-basis: 100%; } .pv-frame { width: 100%; } }
</style>
</head>
<body>
<div class="pv-wrap">
  <div class="pv-row">
    <div class="pv-col">
      <p class="pv-label">手机 · 深色（默认）</p>
      <div class="pv-frame"><div class="home">
  <header class="home-top">
